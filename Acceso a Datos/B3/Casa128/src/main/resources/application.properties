spring.application.name=PC128

# URL de conexión: 'file:' guarda los datos en disco (persisten al reiniciar).
# Si usaras 'mem:' los datos se perderían al apagar la aplicación.
spring.datasource.url=jdbc:h2:file:~/data/gimnasio
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true

# Controla si se ejecuta data.sql al arrancar:
#   always  -> se ejecuta siempre y BORRA los datos (DROP ALL OBJECTS;)
#   never   -> NO se ejecuta, los datos se GUARDAN entre reinicios
spring.sql.init.mode=never